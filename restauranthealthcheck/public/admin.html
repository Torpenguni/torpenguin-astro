<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>หลังบ้าน · Restaurant Health Check</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317140F'/%3E%3Cpath d='M9 16.5l4.8 4.8L23 12' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm/ibm-thai-400.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm/ibm-thai-500.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm/ibm-thai-600.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/ibm/ibm-thai-700.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm/ibm-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm/ibm-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm/ibm-latin-600.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/ibm/ibm-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{--paper:#FAF7F2;--surface:#fff;--ink:#17140F;--muted:#5c554c;--faint:#8a8077;--line:#e5ded2;--brand:#C8102E;--amber:#E08A00;--green:#1F9D57;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 'IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.en,.num{font-family:'IBM Plex Sans Thai',-apple-system,sans-serif;font-weight:600}

.bar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;position:sticky;top:0;z-index:5}
.bar .tag{background:rgba(255,255,255,.14);padding:3px 9px;border-radius:6px;font-size:12px}
.bar .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
.bar a,.bar button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.28);
  padding:7px 13px;border-radius:8px;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit}
.bar a:hover,.bar button:hover{background:rgba(255,255,255,.12)}

.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 70px}
.login{max-width:380px;margin:70px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px}
.login h1{font-size:22px;margin:0 0 20px}

label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--brand)}
button.primary{width:100%;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button.primary:disabled{opacity:.55;cursor:not-allowed}

.msg{padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:15px;display:none}
.msg.err{background:#fdecef;border:1px solid #f5c3cd;color:#8d0d24;display:block}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.stat .k{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.02em}
.stat .v{font-size:26px;line-height:1.25;font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600}
.stat .s{font-size:12px;color:var(--faint)}
/* คนที่กดขอให้ติดต่อกลับเอง ต้องเด่นกว่าป้ายอื่นในแถว เพราะเป็นคิวที่ควรโทรก่อน */
.asked{display:inline-block;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;
  padding:2px 8px;border-radius:99px;white-space:nowrap;margin-bottom:4px;letter-spacing:.01em}

.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;align-items:end;margin-bottom:16px}
.filters .go{display:flex;gap:8px}
.filters button{padding:10px 15px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
  font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.filters button.apply{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters a.csv{padding:10px 15px;border-radius:9px;border:1.5px solid var(--green);color:var(--green);
  text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;display:inline-block}
.filters a.csv:hover{background:var(--green);color:#fff}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:940px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f4efe7;font-weight:600;font-size:12.5px;color:var(--muted);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fdfbf8}
td.shop{white-space:normal;min-width:180px;font-weight:600}
td.contact{font-size:13px;color:var(--muted)}
.score{font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600;font-size:17px}
.tier{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
.tier.HOT{background:#fdecef;color:#8d0d24}
.tier.WARM{background:#fff6e8;color:#8a5a00}
.tier.NURTURE{background:#eef1f5;color:#4a5568}
.pill{font-size:11px;padding:2px 7px;border-radius:5px;background:#f0ebe3;color:var(--muted)}
.dims{font-size:12px;color:var(--faint);font-family:'IBM Plex Sans Thai',sans-serif}
.empty{padding:44px 20px;text-align:center;color:var(--faint)}

.pager{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:18px;font-size:14px;color:var(--muted)}
.pager button{padding:8px 15px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
  cursor:pointer;font-family:inherit;font-size:14px}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* แผงรายละเอียดรายคน — เลื่อนเข้ามาจากขวา */
tbody tr{cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(23,20,15,.5);z-index:40;
  opacity:0;transition:opacity .18s}
.sheet-bg.on{opacity:1}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);
  z-index:41;box-shadow:-14px 0 44px rgba(23,20,15,.16);overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease}
.sheet.on{transform:none}
.sheet-head{position:sticky;top:0;background:var(--ink);color:#fff;padding:18px 22px;
  display:flex;align-items:flex-start;gap:14px;z-index:2}
.sheet-head h2{margin:0;font-size:19px;line-height:1.35}
.sheet-head .sub{font-size:13px;color:rgba(255,255,255,.62);margin-top:3px}
.sheet-head button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;
  line-height:1;flex:0 0 auto;font-family:inherit}
.sheet-body{padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.blk h3{margin:0 0 12px;font-size:13px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;text-align:right;font-weight:600;word-break:break-word}
.kv dd a{color:var(--brand);text-decoration:none}
.kv dd a:hover{text-decoration:underline}
.bigscore{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.bigscore .n{font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600;font-size:44px;line-height:1}
.bigscore .d{color:var(--faint);font-size:15px}
.dimrow{display:grid;grid-template-columns:120px 1fr 42px;align-items:center;gap:10px;
  font-size:13.5px;margin-bottom:9px}
.dimrow:last-child{margin-bottom:0}
.track{height:8px;background:#efe9e0;border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px}
.dimrow b{text-align:right;font-family:'IBM Plex Sans Thai',sans-serif}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tags span{background:#fdecef;color:#8d0d24;font-size:13px;font-weight:600;
  padding:6px 11px;border-radius:8px}
.note{font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:10px}
.warnbox{background:#fff6e8;border:1px solid #f3ddb5;color:#8a5a00;border-radius:10px;
  padding:10px 12px;font-size:12.5px;line-height:1.6;margin-top:10px}
@media(max-width:600px){.sheet{width:100%}.kv{grid-template-columns:1fr}.kv dd{text-align:left}}

/* บนมือถือ แถบบนสุดขึ้นบรรทัดใหม่จนดูรก — ตัดป้ายชื่อที่ซ้ำกับ title ออก
   แล้วบีบปุ่มให้อยู่บรรทัดเดียว */
@media(max-width:600px){
  .bar{padding:12px 14px;gap:8px}
  .bar .tag{display:none}
  .bar>span:first-child{white-space:nowrap}
  .bar a,.bar button{padding:6px 10px;font-size:12px;white-space:nowrap}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n) => (n == null ? '—' : Number(n).toLocaleString('th-TH'));
const fmtDate = (ts) => new Date(ts * 1000).toLocaleString('th-TH',
  { day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });

const state = { page: 1, filters: {} };

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw Object.assign(new Error(data.error || 'ระบบขัดข้อง'), { code: data.code, status: res.status });
  return data;
}

function query() {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(state.filters)) if (v) q.set(k, v);
  if (state.page > 1) q.set('page', state.page);
  return q.toString();
}

function renderLogin(message) {
  $('root').innerHTML = `
<div class="login">
  <h1>หลังบ้าน · Restaurant Health Check</h1>
  <div id="msg" class="msg"></div>
  <div style="margin-bottom:16px">
    <label for="pw">รหัสผ่านผู้ดูแล</label>
    <input id="pw" type="password" autocomplete="current-password">
  </div>
  <button class="primary" id="go">เข้าสู่ระบบ</button>
</div>`;
  if (message) { $('msg').className = 'msg err'; $('msg').textContent = message; }

  const submit = async () => {
    const btn = $('go');
    btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
    try {
      await api('/api/admin/login', { password: $('pw').value });
      state.page = 1;
      load();
    } catch (e) {
      $('msg').className = 'msg err';
      $('msg').textContent = e.message;
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    }
  };
  $('go').addEventListener('click', submit);
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  $('pw').focus();
}

function renderDash(d) {
  const s = d.stats;
  const pages = Math.max(1, Math.ceil(d.total / d.pageSize));
  const rate = s.total ? Math.round((s.completed / s.total) * 100) : 0;

  const rows = d.leads.length ? d.leads.map((l) => `
<tr data-id="${esc(l.id)}">
  <td style="font-size:13px;color:var(--faint)">${fmtDate(l.createdAt)}</td>
  <td class="shop">${l.askedAt ? '<span class="asked">ขอให้ติดต่อกลับ</span><br>' : ''}${esc(l.shop || '—')}
    <div style="font-weight:400;font-size:12.5px;color:var(--faint)">${esc(l.name || '')}</div></td>
  <td class="contact">${esc(l.contact || '—')}${l.email ? `<div>${esc(l.email)}</div>` : ''}</td>
  <td>${esc(l.shopType || '—')}${l.branches ? ` <span class="pill">${esc(l.branches)} สาขา</span>` : ''}</td>
  <td>${l.completed ? '' : '<span class="pill">ไม่จบ</span>'}
      ${l.mode === 'quick' ? '<span class="pill">ด่วน</span>' : ''}</td>
  <td class="score">${l.total != null ? l.total : '—'}</td>
  <td>${l.tier ? `<span class="tier ${esc(l.tier)}">${esc(l.tier)}</span>` : '—'}
      <div style="font-size:12px;color:var(--faint)">${esc(l.typeName || '')}</div></td>
  <td class="dims">${l.scores ? ['D1','D2','D3','D4','D5'].map((k) =>
      l.scores[k] != null ? Math.round(l.scores[k]) : '–').join(' · ') : '—'}</td>
  <td style="font-size:12px;color:var(--faint)">${l.hasAccount ? 'มีบัญชี ' : ''}${l.resultEmailed ? '📧' : ''}</td>
</tr>`).join('') : '';

  $('root').innerHTML = `
<div class="bar">
  <span>หลังบ้าน</span><span class="tag">Restaurant Health Check</span>
  <span class="sp"><a href="/" target="_blank">ดูเว็บ</a><button id="out">ออกจากระบบ</button></span>
</div>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="k">คนทำทั้งหมด</div><div class="v">${nf(s.total)}</div></div>
    <div class="stat"><div class="k">ทำจบ</div><div class="v">${nf(s.completed)}</div>
      <div class="s">${rate}% ของทั้งหมด</div></div>
    <div class="stat"><div class="k">มีอีเมล</div><div class="v">${nf(s.withEmail)}</div></div>
    <div class="stat"><div class="k">ขอให้ติดต่อกลับ</div><div class="v" style="color:var(--brand)">${nf(s.asked)}</div>
      <div class="s">กดขอเอง — โทรก่อน</div></div>
    <div class="stat"><div class="k">คะแนนเฉลี่ย</div><div class="v">${s.avgScore != null ? s.avgScore : '—'}</div>
      <div class="s">เฉพาะคนที่ทำจบ</div></div>
    <div class="stat"><div class="k">HOT</div><div class="v" style="color:var(--brand)">${nf(s.hot)}</div></div>
    <div class="stat"><div class="k">WARM</div><div class="v" style="color:var(--amber)">${nf(s.warm)}</div></div>
    <div class="stat"><div class="k">NURTURE</div><div class="v" style="color:#4a5568">${nf(s.nurture)}</div></div>
  </div>

  <div class="filters">
    <div><label for="f_q">ค้นหา</label><input id="f_q" placeholder="ชื่อร้าน ชื่อ อีเมล เบอร์" value="${esc(state.filters.q || '')}"></div>
    <div><label for="f_tier">Tier</label><select id="f_tier">
      <option value="">ทั้งหมด</option>
      ${['HOT','WARM','NURTURE'].map((t) =>
        `<option value="${t}"${state.filters.tier === t ? ' selected' : ''}>${t}</option>`).join('')}
    </select></div>
    <div><label for="f_type">ประเภทร้าน</label><select id="f_type">
      <option value="">ทั้งหมด</option>
      ${d.shopTypes.map((t) =>
        `<option value="${esc(t)}"${state.filters.type === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}
    </select></div>
    <div><label for="f_status">สถานะ</label><select id="f_status">
      <option value="">ทั้งหมด</option>
      <option value="completed"${state.filters.status === 'completed' ? ' selected' : ''}>ทำจบ</option>
      <option value="partial"${state.filters.status === 'partial' ? ' selected' : ''}>ทำไม่จบ</option>
    </select></div>
    <div><label for="f_asked">ขอให้ติดต่อ</label><select id="f_asked">
      <option value="">ทั้งหมด</option>
      <option value="1"${state.filters.asked === '1' ? ' selected' : ''}>เฉพาะคนที่กดขอ</option>
    </select></div>
    <div><label for="f_from">ตั้งแต่วันที่</label><input id="f_from" type="date" value="${esc(state.filters._from || '')}"></div>
    <div><label for="f_to">ถึงวันที่</label><input id="f_to" type="date" value="${esc(state.filters._to || '')}"></div>
    <div class="go">
      <button class="apply" id="apply">กรอง</button>
      <button id="clear">ล้าง</button>
      <a class="csv" href="/api/admin/export?${query()}">⤓ CSV</a>
    </div>
  </div>

  <div class="tablewrap">
    ${rows ? `<table><thead><tr>
      <th>วันที่</th><th>ร้าน</th><th>ติดต่อ</th><th>ประเภท</th><th></th>
      <th>คะแนน</th><th>Tier</th><th>D1·D2·D3·D4·D5</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table>`
    : '<div class="empty">ยังไม่มีข้อมูลตามเงื่อนไขนี้</div>'}
  </div>

  <div class="pager">
    <button id="prev"${d.page <= 1 ? ' disabled' : ''}>← ก่อนหน้า</button>
    <span>หน้า ${d.page} จาก ${pages} · ทั้งหมด ${nf(d.total)} รายการ</span>
    <button id="next"${d.page >= pages ? ' disabled' : ''}>ถัดไป →</button>
  </div>
</div>`;

  document.querySelectorAll('tbody tr[data-id]').forEach((tr) =>
    tr.addEventListener('click', () => openLead(tr.dataset.id)));

  $('apply').addEventListener('click', () => {
    const from = $('f_from').value, to = $('f_to').value;
    state.filters = {
      q: $('f_q').value.trim(),
      tier: $('f_tier').value,
      type: $('f_type').value,
      status: $('f_status').value,
      asked: $('f_asked').value,
      _from: from, _to: to,
      // The API filters on unix seconds; `to` covers the whole day chosen.
      from: from ? Math.floor(new Date(from + 'T00:00:00').getTime() / 1000) : '',
      to: to ? Math.floor(new Date(to + 'T23:59:59').getTime() / 1000) : '',
    };
    state.page = 1;
    load();
  });
  $('clear').addEventListener('click', () => { state.filters = {}; state.page = 1; load(); });
  $('prev').addEventListener('click', () => { state.page--; load(); });
  $('next').addEventListener('click', () => { state.page++; load(); });
  $('f_q').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('apply').click(); });
  $('out').addEventListener('click', async () => {
    try { await api('/api/admin/logout', {}); } catch (e) {}
    renderLogin();
  });
}


const DIM_LABEL = { D1: 'ตัวเจ้าของ & ผู้นำ', D2: 'สุขภาพการเงิน', D3: 'แบรนด์ & การตลาด',
  D4: 'ระบบ & ทีม', D5: 'ความพร้อมขยาย' };
const INTENT_LABEL = {
  need_supplier: '🥩 Supplier / วัตถุดิบต้นทุนดี', need_capital: '💵 แหล่งทุน / นักลงทุน',
  need_franchise: '🏪 แฟรนไชส์ / ขยายสาขา', need_marketing: '📣 การตลาด / สร้างแบรนด์',
  need_system: '⚙️ ระบบหลังบ้าน / POS / สต็อก' };
const dimColor = (v) => (v >= 60 ? 'var(--green)' : v >= 40 ? 'var(--amber)' : 'var(--brand)');
const baht = (n) => (n == null || n === '' ? '—' : '฿' + Number(n).toLocaleString('th-TH'));
const pct = (a, b) => (a && b ? (a / b * 100).toFixed(1) + '%' : '—');

function row(k, v) { return v == null || v === '' ? '' : `<dt>${k}</dt><dd>${v}</dd>`; }

function leadSheet(l) {
  const fin = l.financial;
  const net = fin && fin.revenue
    ? fin.revenue - (fin.cogs || 0) - (fin.labor || 0) - (fin.rent || 0) - (fin.other || 0) : null;

  const dims = l.scores ? Object.keys(DIM_LABEL).filter((k) => l.scores[k] != null).map((k) => {
    const v = Math.round(l.scores[k]);
    return `<div class="dimrow"><span>${DIM_LABEL[k]}</span>
      <span class="track"><i style="width:${v}%;background:${dimColor(v)}"></i></span>
      <b style="color:${dimColor(v)}">${v}</b></div>`;
  }).join('') : '<div style="color:var(--faint);font-size:14px">ยังทำไม่จบ จึงไม่มีคะแนน</div>';

  return `
<div class="sheet-head">
  <div>
    <h2>${esc(l.shop || 'ไม่ได้ระบุชื่อร้าน')}</h2>
    <div class="sub">${esc(l.name || '')} · ${fmtDate(l.createdAt)}</div>
  </div>
  <button id="sheetClose" aria-label="ปิด">✕</button>
</div>
<div class="sheet-body">

  <div class="blk">
    <h3>ติดต่อ</h3>
    <dl class="kv">
      ${row('ชื่อเจ้าของ', esc(l.name))}
      ${row('เบอร์ / LINE', l.contact
        ? `<a href="tel:${esc(String(l.contact).replace(/[^+\d]/g, ''))}">${esc(l.contact)}</a>` : '')}
      ${row('อีเมล', l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : '')}
    </dl>
    ${!l.email ? '<div class="note">ไม่ได้ให้อีเมลไว้ — ติดต่อได้ทางเบอร์/LINE เท่านั้น</div>' : ''}
  </div>

  <div class="blk">
    <h3>ผลประเมิน</h3>
    ${l.total != null ? `<div class="bigscore">
      <span class="n" style="color:${dimColor(l.total)}">${l.total}</span>
      <span class="d">/100</span>
      ${l.tier ? `<span class="tier ${esc(l.tier)}" style="margin-left:auto">${esc(l.tier)}</span>` : ''}
    </div>
    ${l.typeName ? `<div style="font-size:14px;color:var(--muted);margin-bottom:14px">${esc(l.typeName)}</div>` : ''}`
    : `<div style="color:var(--faint);font-size:14px;margin-bottom:12px">ทำไม่จบ — ไม่มีคะแนน</div>`}
    ${dims}
  </div>

  <div class="blk">
    <h3>ข้อมูลร้าน</h3>
    <dl class="kv">
      ${row('ประเภท', esc(l.shopType))}
      ${row('จำนวนสาขา', esc(l.branches))}
      ${row('อายุร้าน', esc(l.age))}
      ${row('ทำแบบ', l.mode === 'quick' ? 'ด่วน (10 ข้อ)' : 'ละเอียด (48 ข้อ)')}
      ${row('สถานะ', l.completed ? 'ทำจบแล้ว' : 'ทำไม่จบ')}
    </dl>
  </div>

  ${fin && !fin.revenue && fin.primePct != null ? `<div class="blk">
    <h3>ตัวเลขการเงิน</h3>
    <dl class="kv">
      ${row('Prime cost', fin.primePct + '%')}
      ${row('ต้นทุนอาหาร', fin.foodPct !== '' && fin.foodPct != null ? fin.foodPct + '%' : '')}
      ${row('ค่าแรง', fin.laborPct !== '' && fin.laborPct != null ? fin.laborPct + '%' : '')}
      ${row('กำไรสุทธิ', fin.netPct != null ? fin.netPct + '%' : '')}
    </dl>
    <div class="note">รายการนี้บันทึกไว้ก่อนระบบจะเก็บตัวเลขบาทดิบ จึงมีแต่เปอร์เซ็นต์</div>
  </div>` : ''}

  ${fin && fin.revenue ? `<div class="blk">
    <h3>ตัวเลขการเงิน (ต่อเดือน)</h3>
    <dl class="kv">
      ${row('ยอดขาย', baht(fin.revenue))}
      ${row('ต้นทุนอาหาร', `${baht(fin.cogs)} <span style="color:var(--faint);font-weight:400">· ${pct(fin.cogs, fin.revenue)}</span>`)}
      ${row('ค่าแรง', `${baht(fin.labor)} <span style="color:var(--faint);font-weight:400">· ${pct(fin.labor, fin.revenue)}</span>`)}
      ${row('ค่าเช่า', baht(fin.rent))}
      ${row('ค่าใช้จ่ายอื่น', baht(fin.other))}
      ${row('Prime cost', pct((fin.cogs || 0) + (fin.labor || 0), fin.revenue))}
      ${row('กำไรสุทธิ', net == null ? '' :
        `<span style="color:${net >= 0 ? 'var(--green)' : 'var(--brand)'}">${baht(net)} · ${pct(net, fin.revenue)}</span>`)}
    </dl>
    ${fin.estimated ? `<div class="warnbox">⚠️ ผู้ใช้ไม่ได้แก้ตัวเลขต้นทุนเอง
      ค่าที่เห็นเป็น<b>ค่าประมาณที่ระบบเดาให้</b>จากช่วงยอดขาย
      — อย่าใช้วินิจฉัยราวกับเป็นตัวเลขจริง ควรถามตัวเลขจริงตอนคุย</div>` : ''}
  </div>` : (fin && fin.primePct != null ? '' : `<div class="blk"><h3>ตัวเลขการเงิน</h3>
    <div style="color:var(--faint);font-size:14px">ไม่ได้กรอก (ข้ามขั้นนี้ได้)</div></div>`)}

  ${l.intent && l.intent.length ? `<div class="blk">
    <h3>สนใจให้ช่วยเรื่อง</h3>
    <div class="tags">${l.intent.map((t) => `<span>${esc(INTENT_LABEL[t] || t)}</span>`).join('')}</div>
  </div>` : ''}

  <div class="blk">
    <h3>อื่น ๆ</h3>
    <dl class="kv">
      ${row('ยินยอม PDPA เมื่อ', l.consentAt ? fmtDate(l.consentAt) : '')}
      ${row('ขอให้ติดต่อกลับ', l.askedAt ? fmtDate(l.askedAt) : '—')}
      ${row('ส่งผลทางอีเมลแล้ว', l.resultEmailedAt ? fmtDate(l.resultEmailedAt) : (l.email ? 'ยังไม่ได้ส่ง' : ''))}
      ${row('สมัครบัญชีไว้', l.account
        ? `${esc(l.account.email)}${l.account.verified ? '' : ' (ยังไม่ยืนยัน)'}` : '')}
      ${row('มาจาก', l.referrer ? esc(l.referrer) : '')}
      ${row('อัปเดตล่าสุด', fmtDate(l.updatedAt))}
    </dl>
  </div>
</div>`;
}

let sheetEsc = null;
async function openLead(id) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = '<div class="sheet-body" style="padding-top:40px;color:var(--faint)">กำลังโหลด…</div>';
  document.body.append(bg, sheet);
  requestAnimationFrame(() => { bg.classList.add('on'); sheet.classList.add('on'); });

  const close = () => {
    bg.classList.remove('on'); sheet.classList.remove('on');
    document.removeEventListener('keydown', sheetEsc);
    setTimeout(() => { bg.remove(); sheet.remove(); }, 220);
  };
  sheetEsc = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', sheetEsc);
  bg.addEventListener('click', close);

  try {
    const d = await api('/api/admin/lead?id=' + encodeURIComponent(id));
    sheet.innerHTML = leadSheet(d.lead);
    sheet.querySelector('#sheetClose').addEventListener('click', close);
  } catch (e) {
    sheet.innerHTML = `<div class="sheet-body" style="padding-top:40px">
      <div class="msg err" style="display:block">${esc(e.message)}</div></div>`;
  }
}

async function load() {
  try {
    renderDash(await api('/api/admin/leads?' + query()));
  } catch (e) {
    if (e.status === 401) renderLogin();
    else renderLogin(e.message);
  }
}

load();
</script>
</body>
</html>
