<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บัญชีของคุณ · Restaurant Health Check</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C8102E'/%3E%3Cpath d='M9 16.5l4.8 4.8L23 12' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm/ibm-thai-400.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm/ibm-thai-500.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm/ibm-thai-600.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/ibm/ibm-thai-700.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/ibm/ibm-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/ibm/ibm-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/ibm/ibm-latin-600.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/ibm/ibm-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{
  --paper:#FAF7F2; --surface:#fff; --ink:#17140F; --muted:#6b6257; --faint:#8a8077;
  --line:#e5ded2; --brand:#C8102E; --amber:#E08A00; --green:#1F9D57;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 'IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,.en,.brandbar,button{font-family:'IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,sans-serif}

.brandbar{display:flex;align-items:center;gap:13px;padding:14px 22px;
  border-bottom:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.brandbar .sep{width:1px;height:18px;background:var(--line)}
/* โลโก้ชุดเดียวกับหน้าแรกเป๊ะ ๆ คนกดไปมาระหว่างสองหน้าจะได้รู้สึกว่าเป็นที่เดียวกัน
   ความสูงสองอันไม่เท่ากันโดยตั้งใจ ตราวงกลมสายตาคนเห็นเล็กกว่าคำที่สูงเท่ากัน */
.brandbar .lg-px{height:22px;width:auto;display:block}
.brandbar .lg-cp{height:36px;width:auto;display:block}
.brandbar .cp{display:inline-flex;align-items:center;gap:7px;color:var(--faint);font-size:12px;font-weight:500}
.brandbar a{margin-left:auto;color:var(--faint);text-decoration:none;font-size:14px;white-space:nowrap}
.brandbar a:hover{color:var(--brand)}
@media(max-width:600px){
  .brandbar{gap:9px}
  .brandbar .lg-px{height:18px}
  .brandbar .lg-cp{height:30px}
  .brandbar .cp{font-size:11px;gap:6px}
}

.wrap{max-width:430px;margin:0 auto;padding:38px 20px 70px}
h1{font-size:27px;line-height:1.3;margin:0 0 8px;font-weight:600;letter-spacing:-.2px}
.lead{color:var(--muted);font-size:15px;margin:0 0 26px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 7px;color:var(--ink)}
input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--brand)}
.field{margin-bottom:17px}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.5}

button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--brand);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer;transition:opacity .15s}
button:hover:not(:disabled){opacity:.9}
button:disabled{opacity:.55;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.msg{padding:13px 15px;border-radius:11px;font-size:14.5px;line-height:1.6;margin-bottom:18px;display:none}
.msg.err{background:#fdecef;border:1px solid #f5c3cd;color:#8d0d24;display:block}
.msg.ok{background:#eaf7ef;border:1px solid #bde5cd;color:#146c3c;display:block}
.msg.info{background:#fff6e8;border:1px solid #f3ddb5;color:#8a5a00;display:block}

.alt{margin-top:20px;font-size:14.5px;color:var(--muted);text-align:center;line-height:2}
.alt a{color:var(--brand);text-decoration:none;font-weight:600}
.alt a:hover{text-decoration:underline}
.sep-line{height:1px;background:var(--line);margin:20px 0}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .shop{font-weight:600}
a.row.link{text-decoration:none;color:inherit;cursor:pointer;transition:background .12s}
a.row.link:hover,a.row.link:focus-visible{background:var(--surface-2,#f6f4ef)}
a.row.link:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.row .open{font-size:12.5px;color:var(--brand);font-weight:600;margin-top:4px}
.row .meta{font-size:13px;color:var(--faint)}
.score{font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600;font-size:24px}
.tier{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.tier.HOT{background:#fdecef;color:#8d0d24}
.tier.WARM{background:#fff6e8;color:#8a5a00}
.tier.NURTURE{background:#eef1f5;color:#4a5568}
.empty{color:var(--faint);font-size:14.5px;text-align:center;padding:26px 0}
</style>
</head>
<body>

<div class="brandbar">
  <img class="lg-px" src="/logos/penguinx.png" alt="PenguinX" width="655" height="128">
  <span class="sep"></span>
  <span class="cp">Sponsored by<img class="lg-cp" src="/logos/cp.png" alt="CP" width="128" height="128"></span>
  <a href="/">← กลับหน้าแรก</a>
</div>

<div class="wrap">
  <div id="msg" class="msg"></div>
  <div id="view"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function say(text, kind) {
  const el = $('msg');
  el.className = 'msg ' + kind;
  el.textContent = text;
  el.scrollIntoView({ block: 'nearest' });
}
function clearMsg() { $('msg').className = 'msg'; $('msg').textContent = ''; }

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-JSON error page */ }
  if (!res.ok) throw Object.assign(new Error(data.error || 'ระบบขัดข้อง กรุณาลองใหม่อีกครั้ง'), { code: data.code });
  return data;
}

// Keeps a submit button from firing twice on a slow connection.
function busy(btn, on, label) {
  btn.disabled = on;
  btn.textContent = on ? 'กำลังดำเนินการ…' : label;
}

const views = {
  login() {
    return `<h1>เข้าสู่ระบบ</h1>
<p class="lead">เข้ามาดูผลประเมินย้อนหลังของร้านคุณ</p>
<div class="card">
  <div class="field"><label for="email">อีเมล</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com"></div>
  <div class="field"><label for="password">รหัสผ่าน</label>
    <input id="password" type="password" autocomplete="current-password"></div>
  <button id="go">เข้าสู่ระบบ</button>
</div>
<div class="alt">
  <a href="?mode=forgot">ลืมรหัสผ่าน?</a><br>
  ยังไม่มีบัญชี? <a href="?mode=signup">สมัครใช้งาน</a>
</div>`;
  },

  signup() {
    return `<h1>สมัครใช้งาน</h1>
<p class="lead">สร้างบัญชีไว้ เพื่อกลับมาดูผลประเมินของร้านได้ทุกเมื่อ</p>
<div class="card">
  <div class="field"><label for="email">อีเมล</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com"></div>
  <div class="field"><label for="password">ตั้งรหัสผ่าน</label>
    <input id="password" type="password" autocomplete="new-password">
    <div class="hint">อย่างน้อย 8 ตัวอักษร — แนะนำให้ใช้วลีที่จำง่ายแต่เดายาก</div></div>
  <div class="field"><label for="password2">พิมพ์รหัสผ่านอีกครั้ง</label>
    <input id="password2" type="password" autocomplete="new-password"></div>
  <button id="go">สมัครใช้งาน</button>
</div>
<div class="alt">
  มีบัญชีอยู่แล้ว? <a href="?mode=login">เข้าสู่ระบบ</a><br>
  <a href="?mode=forgot">ลืมรหัสผ่าน?</a>
</div>`;
  },

  forgot() {
    return `<h1>ลืมรหัสผ่าน</h1>
<p class="lead">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้</p>
<div class="card">
  <div class="field"><label for="email">อีเมล</label>
    <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com"></div>
  <button id="go">ส่งลิงก์ตั้งรหัสใหม่</button>
</div>
<div class="alt"><a href="?mode=login">← กลับไปหน้าเข้าสู่ระบบ</a></div>`;
  },

  reset() {
    return `<h1>ตั้งรหัสผ่านใหม่</h1>
<p class="lead">ตั้งรหัสใหม่ให้บัญชีของคุณ</p>
<div class="card">
  <div class="field"><label for="password">รหัสผ่านใหม่</label>
    <input id="password" type="password" autocomplete="new-password">
    <div class="hint">อย่างน้อย 8 ตัวอักษร</div></div>
  <div class="field"><label for="password2">พิมพ์รหัสใหม่อีกครั้ง</label>
    <input id="password2" type="password" autocomplete="new-password"></div>
  <button id="go">บันทึกรหัสผ่านใหม่</button>
</div>
<div class="alt">ลิงก์นี้ใช้ได้ครั้งเดียว ภายใน 30 นาที</div>`;
  },

  account(user, list) {
    // แถวที่ทำจบแล้วกดเปิดรายงานฉบับเต็มได้ ใช้ <a> จริงเพื่อให้เปิดแท็บใหม่
    // กดค้าง คัดลอกลิงก์ และเลื่อนหาด้วยแป้นพิมพ์ได้ตามปกติ แถวที่ทำไม่จบไม่มี
    // รายงานให้เปิด จึงคงเป็นข้อความเฉย ๆ ไม่หลอกให้กด
    const rows = list.length
      ? list.map((a) => {
        const body = `<div><div class="shop">${esc(a.shop || 'ไม่ได้ระบุชื่อร้าน')}</div>
    <div class="meta">${new Date(a.createdAt * 1000).toLocaleDateString('th-TH',
      { year: 'numeric', month: 'short', day: 'numeric' })}${a.province ? ' · ' + esc(a.province) : ''}${a.completed ? '' : ' · ทำไม่จบ'}</div></div>
  <div style="text-align:right">
    ${a.total != null ? `<div class="score">${a.total}<span style="font-size:13px;color:var(--faint)">/100</span></div>` : ''}
    ${a.tier ? `<span class="tier ${esc(a.tier)}">${esc(TIER_TH[a.tier] || a.tier)}</span>` : ''}
    ${a.completed ? '<div class="open">ดูรายงานฉบับเต็ม →</div>' : ''}
  </div>`;
        return a.completed
          ? `<a class="row link" href="/?report=${encodeURIComponent(a.id)}">${body}</a>`
          : `<div class="row">${body}</div>`;
      }).join('')
      : '<div class="empty">ยังไม่มีผลประเมิน — เริ่มทำได้เลย</div>';

    return `<h1>บัญชีของคุณ</h1>
<p class="lead">${esc(user.email)}</p>
<div class="card">
  <div style="font-weight:600;margin-bottom:4px">ผลประเมินย้อนหลัง</div>
  ${rows}
  <div class="sep-line"></div>
  <button onclick="location.href='/'">ทำแบบประเมินใหม่</button>
  <div style="height:10px"></div>
  <button class="ghost" id="logout">ออกจากระบบ</button>
</div>`;
  },
};

const handlers = {
  async login() {
    const btn = $('go');
    busy(btn, true);
    try {
      await api('/api/auth/login', { email: $('email').value, password: $('password').value });
      location.href = '/account';
    } catch (e) {
      say(e.message, 'err');
      if (e.code === 'email_not_verified') {
        say(e.message + ' — กดที่ "ลืมรหัสผ่าน" เพื่อให้ระบบส่งลิงก์ยืนยันใหม่ให้', 'info');
      }
      busy(btn, false, 'เข้าสู่ระบบ');
    }
  },

  async signup() {
    const btn = $('go');
    if ($('password').value !== $('password2').value) {
      say('รหัสผ่านสองช่องไม่ตรงกัน', 'err');
      return;
    }
    busy(btn, true);
    try {
      const r = await api('/api/auth/signup', { email: $('email').value, password: $('password').value });
      say(r.message, 'ok');
      $('go').style.display = 'none';
    } catch (e) {
      say(e.message, 'err');
      busy(btn, false, 'สมัครใช้งาน');
    }
  },

  async forgot() {
    const btn = $('go');
    busy(btn, true);
    try {
      const r = await api('/api/auth/forgot', { email: $('email').value });
      say(r.message, 'ok');
      $('go').style.display = 'none';
    } catch (e) {
      say(e.message, 'err');
      busy(btn, false, 'ส่งลิงก์ตั้งรหัสใหม่');
    }
  },

  async reset() {
    const btn = $('go');
    if ($('password').value !== $('password2').value) {
      say('รหัสผ่านสองช่องไม่ตรงกัน', 'err');
      return;
    }
    busy(btn, true);
    try {
      const r = await api('/api/auth/reset', { token: params.get('token'), password: $('password').value });
      say(r.message, 'ok');
      $('go').style.display = 'none';
      setTimeout(() => { location.href = '/account?mode=login'; }, 2200);
    } catch (e) {
      say(e.message, 'err');
      busy(btn, false, 'บันทึกรหัสผ่านใหม่');
    }
  },
};

function wire(mode) {
  const btn = $('go');
  if (!btn) return;
  btn.addEventListener('click', handlers[mode]);
  // Enter should submit, the way every other login form on the internet does.
  document.querySelectorAll('input').forEach((el) =>
    el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') handlers[mode](); }));
}

// ถ้าถูกส่งมาจากประตูโหมดละเอียด พอมีเซสชันแล้วให้พากลับไปทำต่อทันที
// ไม่ปล่อยให้เขาต้องเดินกลับไปหาปุ่มเอง — โดยเฉพาะคนที่เพิ่งกดลิงก์ยืนยัน
// จากในเมลซึ่งกลับมาถึงหน้านี้พอดี
function resumePending() {
  let next = null;
  try { next = localStorage.getItem('rhc_next'); localStorage.removeItem('rhc_next'); } catch (e) {}
  if (next === 'deep') { location.href = '/?start=deep'; return true; }
  return false;
}

// ข้อความเวลาเปิดรายงานย้อนหลังไม่สำเร็จ — หน้ารายงานส่งมาเป็นรหัสตายตัว
// ไม่ใช่ข้อความ จะได้ไม่มีใครยัดข้อความอะไรก็ได้ขึ้นหน้าเว็บผ่าน URL
// เจ้าของร้านเห็นป้ายนี้ในประวัติของตัวเอง คำว่า NURTURE ไม่ได้บอกอะไรเขาเลย
// (และฟังดูเหมือนถูกจัดชั้น) จึงเขียนเป็นความพร้อมของร้านตามที่คะแนนบอก
const TIER_TH = { HOT: 'พร้อมขยาย', WARM: 'มีจุดต้องเสริม', NURTURE: 'ต้องวางรากฐาน' };

const REPORT_ERROR = {
  notfound: 'ไม่พบผลประเมินนี้ในบัญชีของคุณ — ถ้าคุณทำไว้ด้วยอีเมลอื่น ลองเข้าสู่ระบบด้วยอีเมลนั้น',
  nosnapshot: 'ผลประเมินนี้ทำไว้ก่อนระบบเริ่มเก็บรายงานย้อนหลัง จึงเปิดดูรายงานฉบับเต็มไม่ได้ — ทำใหม่อีกครั้งแล้วจะเปิดย้อนหลังได้ทุกเมื่อ',
  offline: 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง',
  error: 'เปิดรายงานนี้ไม่ได้ ลองใหม่อีกครั้ง',
};

async function boot() {
  const reportErr = params.get('report');
  if (reportErr && REPORT_ERROR[reportErr]) say(REPORT_ERROR[reportErr], 'err');

  const verified = params.get('verified');
  if (verified === '1') say('ยืนยันอีเมลเรียบร้อยแล้ว ยินดีต้อนรับครับ', 'ok');
  if (verified === 'expired') say('ลิงก์ยืนยันหมดอายุหรือถูกใช้ไปแล้ว — กดที่ "ลืมรหัสผ่าน" เพื่อขอลิงก์ใหม่', 'err');

  const mode = params.get('mode');

  if (mode === 'reset') {
    if (!params.get('token')) {
      say('ลิงก์ไม่ถูกต้อง กรุณาขอลิงก์ตั้งรหัสผ่านใหม่อีกครั้ง', 'err');
      $('view').innerHTML = views.forgot();
      wire('forgot');
      return;
    }
    $('view').innerHTML = views.reset();
    wire('reset');
    return;
  }

  if (mode === 'signup' || mode === 'forgot') {
    $('view').innerHTML = views[mode]();
    wire(mode);
    return;
  }

  // No mode given: show the dashboard when signed in, otherwise the login form.
  let me = { user: null };
  try { me = await api('/api/auth/me'); } catch (e) { /* treat as signed out */ }

  if (!me.user || mode === 'login') {
    $('view').innerHTML = views.login();
    wire('login');
    return;
  }

  // มีเซสชันแล้ว — ถ้ามีงานค้างจากประตูโหมดละเอียด พากลับไปทำต่อเลย
  if (resumePending()) return;

  let list = [];
  try { list = (await api('/api/assessments')).assessments || []; } catch (e) { /* show empty */ }

  $('view').innerHTML = views.account(me.user, list);
  $('logout').addEventListener('click', async () => {
    try { await api('/api/auth/logout', {}); } catch (e) { /* clearing anyway */ }
    location.href = '/';
  });
}

boot();
</script>
</body>
</html>
